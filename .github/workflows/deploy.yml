name: Deploy

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: textfix-${{ github.ref }}
  cancel-in-progress: false

env:
  WEB_IMAGE: ghcr.io/phollaki/textfix/web
  SITE_URL: https://textfix.puteanihollakos.com

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image
        run: |
          printf '%s\n' "$GITHUB_SHA" > web/version.txt
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$WEB_IMAGE:production" --tag "$WEB_IMAGE:$GITHUB_SHA" web

      - name: Publish image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$WEB_IMAGE:$GITHUB_SHA"
          docker push "$WEB_IMAGE:production"

      - name: Wait for the server to deploy this version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WAIT_FOR_DEPLOY == 'true'
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent --max-time 10 "$SITE_URL/version.txt" | grep -qx "$GITHUB_SHA"; then
              echo "Live: $GITHUB_SHA"
              exit 0
            fi
            sleep 15
          done
          echo "The server did not deploy $GITHUB_SHA in time" >&2
          exit 1
